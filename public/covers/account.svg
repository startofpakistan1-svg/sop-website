  <rect x="200" y="42" width="120" height="40" rx="12" fill="#fff" stroke="#E4EAF5"/>
  <text x="260" y="67" fill="#12296B">Listings</text>

  <rect x="332" y="92" width="120" height="40" rx="12" fill="#fff" stroke="#E4EAF5"/>
  <text x="392" y="117" fill="#12296B">Advertising</text>

  <rect x="332" y="228" width="120" height="40" rx="12" fill="#fff" stroke="#E4EAF5"/>
  <text x="392" y="253" fill="#12296B">Inventory</text>

  <rect x="200" y="278" width="120" height="40" rx="12" fill="#fff" stroke="#E4EAF5"/>
  <text x="260" y="303" fill="#12296B">Customer service</text>

  <rect x="68" y="228" width="120" height="40" rx="12" fill="#fff" stroke="#E4EAF5"/>
  <text x="128" y="253" fill="#12296B">Account health</text>

  <rect x="68" y="92" width="120" height="40" rx="12" fill="#fff" stroke="#E4EAF5"/>
