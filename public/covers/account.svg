<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" fill="none" font-family="Plus Jakarta Sans, system-ui, sans-serif">
<defs>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B5CE6"/><stop offset="1" stop-color="#12296B"/></linearGradient>
<linearGradient id="o" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBB016"/><stop offset="1" stop-color="#F5871F"/></linearGradient>
<filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1226" flood-opacity=".14"/></filter>
</defs>

<!-- connectors -->
<g stroke="#C9D6F2" stroke-width="2" stroke-linecap="round">
  <path d="M260 180L260 62"/>
  <path d="M260 180L392 112"/>
  <path d="M260 180L392 248"/>
  <path d="M260 180L260 298"/>
  <path d="M260 180L128 248"/>
  <path d="M260 180L128 112"/>
</g>
<!-- flowing dots -->
<g fill="#F5871F">
  <circle cx="260" cy="120" r="3.5"/>
  <circle cx="326" cy="146" r="3.5"/>
  <circle cx="326" cy="214" r="3.5"/>
  <circle cx="260" cy="240" r="3.5"/>
  <circle cx="194" cy="214" r="3.5"/>
  <circle cx="194" cy="146" r="3.5"/>
</g>

<!-- hub -->
<g filter="url(#s)">
  <rect x="216" y="136" width="88" height="88" rx="24" fill="url(#o)"/>
  <text x="260" y="186" fill="#fff" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="-.5">SOP</text>
</g>

