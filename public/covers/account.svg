<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" fill="none" font-family="Plus Jakarta Sans, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B5CE6"/><stop offset="1" stop-color="#12296B"/></linearGradient>
<linearGradient id="o" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBB016"/><stop offset="1" stop-color="#F5871F"/></linearGradient>
<filter id="s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B1226" flood-opacity=".15"/></filter>
</defs>

<!-- connectors -->
<g stroke="#C9D6F0" stroke-width="1.8" stroke-dasharray="4 5">
<path d="M260 180L110 70"/><path d="M260 180L410 70"/>
<path d="M260 180L80 180"/><path d="M260 180L440 180"/>
<path d="M260 180L110 290"/><path d="M260 180L410 290"/>
</g>

<!-- hub -->
<g filter="url(#s)">
<circle cx="260" cy="180" r="50" fill="url(#a)"/>
<text x="260" y="177" fill="#fff" font-size="17" font-weight="800" text-anchor="middle">SOP</text>
<text x="260" y="195" fill="#B7C4E0" font-size="9.5" font-weight="600" text-anchor="middle">runs it all</text>
</g>

<!-- six nodes -->
<g filter="url(#s)" font-size="11.5" font-weight="700" fill="#0B1226" text-anchor="middle">
<rect x="46" y="48" width="128" height="44" rx="11" fill="#fff" stroke="#E4EAF5"/>
<text x="110" y="75">Listings</text>

<rect x="346" y="48" width="128" height="44" rx="11" fill="#fff" stroke="#E4EAF5"/>
<text x="410" y="75">Advertising</text>

<rect x="16" y="158" width="128" height="44" rx="11" fill="#fff" stroke="#E4EAF5"/>
<text x="80" y="185">Inventory</text>

<rect x="376" y="158" width="128" height="44" rx="11" fill="#fff" stroke="#E4EAF5"/>
<text x="440" y="185">Customer service</text>

<rect x="46" y="268" width="128" height="44" rx="11" fill="url(#o)"/>
<text x="110" y="295" fill="#fff">Account health</text>

<rect x="346" y="268" width="128" height="44" rx="11" fill="#fff" stroke="#E4EAF5"/>
<text x="410" y="295">Brand &amp; A+</text>
</g>
</svg>
