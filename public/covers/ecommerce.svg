<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" fill="none" font-family="Plus Jakarta Sans, system-ui, sans-serif">
<defs>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B5CE6"/><stop offset="1" stop-color="#12296B"/></linearGradient>
<linearGradient id="o" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBB016"/><stop offset="1" stop-color="#F5871F"/></linearGradient>
<filter id="s" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#0B1226" flood-opacity=".15"/></filter>
</defs>

<!-- browser window with code lines -->
<g filter="url(#s)">
<rect x="80" y="48" width="290" height="264" rx="16" fill="#fff" stroke="#E4EAF5"/>
<rect x="80" y="48" width="290" height="40" rx="16" fill="url(#a)"/>
<rect x="80" y="72" width="290" height="16" fill="url(#a)"/>
<circle cx="102" cy="68" r="5" fill="#fff" opacity=".6"/><circle cx="118" cy="68" r="5" fill="#fff" opacity=".6"/><circle cx="134" cy="68" r="5" fill="#fff" opacity=".6"/>
<rect x="160" y="60" width="150" height="16" rx="8" fill="#fff" opacity=".25"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">
  <text x="104" y="118" fill="#2B5CE6">&lt;section</text><text x="168" y="118" fill="#0B1226">class=</text><text x="212" y="118" fill="#F5871F">"products"</text><text x="286" y="118" fill="#2B5CE6">&gt;</text>
  <text x="120" y="142" fill="#2B5CE6">&lt;article&gt;</text>
  <text x="136" y="166" fill="#2B5CE6">&lt;img</text><text x="170" y="166" fill="#0B1226">src=</text><text x="200" y="166" fill="#F5871F">"suit.webp"</text><text x="282" y="166" fill="#2B5CE6">&gt;</text>
  <text x="136" y="190" fill="#2B5CE6">&lt;h2&gt;</text><text x="170" y="190" fill="#0B1226">Race suit</text><text x="238" y="190" fill="#2B5CE6">&lt;/h2&gt;</text>
  <text x="136" y="214" fill="#2B5CE6">&lt;button&gt;</text><text x="200" y="214" fill="#0B1226">Add to cart</text>
  <text x="120" y="238" fill="#2B5CE6">&lt;/article&gt;</text>
  <text x="104" y="262" fill="#2B5CE6">&lt;/section&gt;</text>
</g>
<rect x="104" y="280" width="120" height="8" rx="4" fill="#EEF3FD"/>
</g>

<!-- speed gauge -->
<g filter="url(#s)">
<circle cx="392" cy="252" r="42" fill="url(#o)"/>
<path d="M370 262a24 24 0 0 1 44 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M392 262l14-16" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<circle cx="392" cy="262" r="4" fill="#fff"/>
</g>
</svg>
