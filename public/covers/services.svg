  <rect x="85" y="165" width="16" height="12" rx="2.5" stroke="#2B5CE6" stroke-width="2" fill="none"/>
  <path d="M85 169h16" stroke="#2B5CE6" stroke-width="1.6"/>
  <text x="122" y="172">Stores that sell</text>
  <text x="122" y="187" font-size="11.5" font-weight="500" fill="#667089">Shopify · WordPress · custom</text>

  <rect x="76" y="206" width="34" height="34" rx="10" fill="#FFF2E3"/>
  <rect x="85" y="216" width="16" height="13" rx="4" stroke="#F5871F" stroke-width="2" fill="none"/>
  <path d="M93 216v-4" stroke="#F5871F" stroke-width="2" stroke-linecap="round"/>
  <text x="122" y="222">AI agents</text>
  <text x="122" y="237" font-size="11.5" font-weight="500" fill="#667089">Chatbots · automation · content</text>

  <rect x="76" y="256" width="34" height="34" rx="10" fill="#EEF3FD"/>
  <circle cx="93" cy="273" r="7" stroke="#2B5CE6" stroke-width="2" fill="none"/>
  <circle cx="93" cy="273" r="2.4" fill="#2B5CE6"/>
  <text x="122" y="272">Everything around it</text>
  <text x="122" y="287" font-size="11.5" font-weight="500" fill="#667089">Branding · SEO · maintenance</text>
</g>

<!-- floating badge -->
<g filter="url(#s)">
<rect x="320" y="238" width="156" height="72" rx="15" fill="url(#o)"/>
<text x="340" y="266" fill="#fff" font-size="12" font-weight="600" opacity=".92">Fixed price, sent in</text>
<text x="340" y="292" fill="#fff" font-size="23" font-weight="800">1 day</text>
</g>
<circle cx="452" cy="70" r="15" fill="#2B5CE6" opacity=".22"/>
</svg>
