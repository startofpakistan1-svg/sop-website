<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" fill="none" font-family="Plus Jakarta Sans, system-ui, sans-serif">
<defs>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B5CE6"/><stop offset="1" stop-color="#12296B"/></linearGradient>
<linearGradient id="o" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBB016"/><stop offset="1" stop-color="#F5871F"/></linearGradient>
<filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1226" flood-opacity=".14"/></filter>
</defs>

<!-- main panel -->
<g filter="url(#s)">
<rect x="58" y="44" width="330" height="272" rx="18" fill="#fff" stroke="#E4EAF5"/>
<rect x="58" y="44" width="330" height="46" rx="18" fill="url(#a)"/>
<rect x="58" y="76" width="330" height="14" fill="url(#a)"/>
<text x="80" y="74" fill="#fff" font-size="15" font-weight="700">What we run for you</text>
</g>

