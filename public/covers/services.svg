  <rect x="76" y="106" width="34" height="34" rx="10" fill="#EEF3FD"/>
  <path d="M85 121h16l-2 10H87l-2-10z" stroke="#2B5CE6" stroke-width="2" fill="none" stroke-linejoin="round"/>
