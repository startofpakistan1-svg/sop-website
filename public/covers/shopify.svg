<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" fill="none" font-family="Plus Jakarta Sans, system-ui, sans-serif">
<defs>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B5CE6"/><stop offset="1" stop-color="#12296B"/></linearGradient>
<linearGradient id="o" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBB016"/><stop offset="1" stop-color="#F5871F"/></linearGradient>
<filter id="s" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#0B1226" flood-opacity=".15"/></filter>
</defs>

<!-- storefront card: product grid -->
<g filter="url(#s)">
<rect x="96" y="40" width="250" height="280" rx="16" fill="#fff" stroke="#E4EAF5"/>
<rect x="96" y="40" width="250" height="52" rx="16" fill="url(#a)"/>
<rect x="96" y="76" width="250" height="16" fill="url(#a)"/>
<text x="122" y="73" fill="#fff" font-size="14" font-weight="700">Your Shopify store</text>
<g fill="#EEF3FD">
  <rect x="118" y="110" width="96" height="72" rx="10"/>
  <rect x="228" y="110" width="96" height="72" rx="10"/>
  <rect x="118" y="212" width="96" height="72" rx="10"/>
  <rect x="228" y="212" width="96" height="72" rx="10"/>
</g>
<g fill="#0B1226">
  <rect x="118" y="190" width="60" height="7" rx="3.5"/>
  <rect x="228" y="190" width="60" height="7" rx="3.5"/>
  <rect x="118" y="292" width="60" height="7" rx="3.5"/>
  <rect x="228" y="292" width="60" height="7" rx="3.5"/>
</g>
<g fill="#2B5CE6">
  <rect x="186" y="190" width="28" height="7" rx="3.5"/>
  <rect x="296" y="190" width="28" height="7" rx="3.5"/>
  <rect x="186" y="292" width="28" height="7" rx="3.5"/>
  <rect x="296" y="292" width="28" height="7" rx="3.5"/>
</g>
</g>

<!-- cart badge -->
<g filter="url(#s)">
<circle cx="380" cy="252" r="42" fill="url(#o)"/>
<path d="M360 240h6l5 22h20l4-14H370" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="373" cy="270" r="3" fill="#fff"/><circle cx="389" cy="270" r="3" fill="#fff"/>
</g>
</svg>
