<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" fill="none" font-family="Plus Jakarta Sans, system-ui, sans-serif">
<defs>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B5CE6"/><stop offset="1" stop-color="#12296B"/></linearGradient>
<linearGradient id="o" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBB016"/><stop offset="1" stop-color="#F5871F"/></linearGradient>
<filter id="s" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#0B1226" flood-opacity=".15"/></filter>
</defs>

<!-- workflow: three agent cards joined by a line, ending in a tick -->
<path d="M150 110 L150 190 L150 270" stroke="#E4EAF5" stroke-width="3" stroke-linecap="round"/>
<path d="M150 110 L150 270" stroke="url(#a)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8"/>

<g filter="url(#s)">
<rect x="150" y="70" width="210" height="60" rx="14" fill="#fff" stroke="#E4EAF5"/>
<circle cx="180" cy="100" r="13" fill="#EEF3FD"/><path d="M174 100h12M180 94v12" stroke="#2B5CE6" stroke-width="2.5" stroke-linecap="round"/>
<text x="204" y="96" fill="#0B1226" font-size="12.5" font-weight="700">Plan</text>
<text x="204" y="113" fill="#667089" font-size="11">Calendar drafted, you approve</text>
</g>

<g filter="url(#s)">
<rect x="150" y="150" width="210" height="60" rx="14" fill="#fff" stroke="#E4EAF5"/>
<circle cx="180" cy="180" r="13" fill="#EEF3FD"/><path d="M174 176h12M174 180h12M174 184h8" stroke="#2B5CE6" stroke-width="2.5" stroke-linecap="round"/>
<text x="204" y="176" fill="#0B1226" font-size="12.5" font-weight="700">Draft</text>
<text x="204" y="193" fill="#667089" font-size="11">Written in your tone, reviewed</text>
</g>

<g filter="url(#s)">
<rect x="150" y="230" width="210" height="60" rx="14" fill="#fff" stroke="#E4EAF5"/>
<circle cx="180" cy="260" r="13" fill="#EEF3FD"/><path d="M175 260l3 3 7-7" stroke="#2B5CE6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="204" y="256" fill="#0B1226" font-size="12.5" font-weight="700">Publish</text>
<text x="204" y="273" fill="#667089" font-size="11">Scheduled, replies flagged to you</text>
</g>

<g filter="url(#s)">
<circle cx="400" cy="252" r="42" fill="url(#o)"/>
<circle cx="400" cy="244" r="11" stroke="#fff" stroke-width="5" fill="none"/>
<path d="M382 274c3-9 10-14 18-14s15 5 18 14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
</g>
</svg>
