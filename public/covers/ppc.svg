<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" fill="none" font-family="Plus Jakarta Sans, system-ui, sans-serif">
<defs>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B5CE6"/><stop offset="1" stop-color="#12296B"/></linearGradient>
<linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B5CE6"/><stop offset="1" stop-color="#5B8DEF"/></linearGradient>
<linearGradient id="o" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBB016"/><stop offset="1" stop-color="#F5871F"/></linearGradient>
<filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1226" flood-opacity=".14"/></filter>
</defs>

<!-- main panel -->
<g filter="url(#s)">
<rect x="50" y="40" width="360" height="280" rx="18" fill="#fff" stroke="#E4EAF5"/>
</g>
<text x="74" y="72" fill="#0B1226" font-size="14" font-weight="800">Sales vs ad spend</text>
<text x="74" y="90" fill="#667089" font-size="11.5" font-weight="600">Illustrative · last 8 weeks</text>

<!-- KPI chips -->
<g font-size="11" font-weight="700">
  <rect x="254" y="58" width="66" height="26" rx="8" fill="#F3F6FC"/>
  <text x="287" y="75" fill="#12296B" text-anchor="middle">ACoS 20%</text>
  <rect x="326" y="58" width="66" height="26" rx="8" fill="#E7F6EC"/>
  <text x="359" y="75" fill="#16A34A" text-anchor="middle">▲ 31%</text>
</g>

<!-- grid -->
<g stroke="#E4EAF5" stroke-width="1">
  <path d="M74 132H388"/><path d="M74 176H388"/><path d="M74 220H388"/><path d="M74 264H388"/>
</g>
<text x="388" y="128" fill="#667089" font-size="10" font-weight="600" text-anchor="end">£8k</text>
<text x="388" y="260" fill="#667089" font-size="10" font-weight="600" text-anchor="end">£2k</text>

<!-- bars (before: light, after: blue) -->
<g>
  <rect x="82"  y="228" width="26" height="60"  rx="6" fill="#C9D6F2"/>
  <rect x="120" y="216" width="26" height="72"  rx="6" fill="#C9D6F2"/>
  <rect x="158" y="208" width="26" height="80"  rx="6" fill="#C9D6F2"/>
  <rect x="196" y="190" width="26" height="98"  rx="6" fill="url(#b)"/>
  <rect x="234" y="172" width="26" height="116" rx="6" fill="url(#b)"/>
  <rect x="272" y="156" width="26" height="132" rx="6" fill="url(#b)"/>
  <rect x="310" y="138" width="26" height="150" rx="6" fill="url(#b)"/>
  <rect x="348" y="120" width="26" height="168" rx="6" fill="url(#b)"/>
</g>

<!-- ACoS line, falling -->
<path d="M95 150 L133 156 L171 160 L209 188 L247 206 L285 218 L323 226 L361 232" stroke="url(#o)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#fff" stroke="#F5871F" stroke-width="2.5">
  <circle cx="95" cy="150" r="4"/><circle cx="171" cy="160" r="4"/><circle cx="247" cy="206" r="4"/><circle cx="361" cy="232" r="4"/>
</g>

<!-- baseline -->
<path d="M74 288H388" stroke="#E4EAF5" stroke-width="1.5"/>
<g fill="#667089" font-size="10" font-weight="600" text-anchor="middle">
  <text x="95" y="306">W1</text><text x="171" y="306">W3</text><text x="247" y="306">W5</text><text x="361" y="306">W8</text>
</g>

<!-- floating badge -->
<g filter="url(#s)">
  <rect x="380" y="150" width="104" height="52" rx="14" fill="url(#a)"/>
  <text x="432" y="172" fill="#B7C4E0" font-size="10" font-weight="700" text-anchor="middle" letter-spacing=".8">WASTED SPEND</text>
  <text x="432" y="191" fill="#fff" font-size="15" font-weight="800" text-anchor="middle">−42%</text>
</g>
</svg>
